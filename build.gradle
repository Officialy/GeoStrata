ext {
    mod_id          = "geostrata"
    mod_name        = "GeoStrata"
    mod_group_id    = "reika.geostrata"
    mod_description = "GeoStrata adds realistic rock layers and geology-based content to the world."
}

dependencies {
    implementation project(":DragonAPI")
    implementation project(":RotaryCraft")

    // Local 26.3 build with NeoForge's NewDatapackRegistryEvent migration.
    // Runtime-required for Arctic Spires and Kelp Forest biome injection.
    implementation "com.github.glitchfiend:TerraBlender-neoforge:26.3-26.3.0.0.7-local.1"
}

neoForge {
    unitTest {
        enable()
        testedMod = mods.named(project.mod_id).get()
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
